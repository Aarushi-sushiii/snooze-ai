<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Snooze | Cozy Reverse Image Search</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(180deg, #ffe2ec 0%, #fbefff 100%);
            min-height: 100vh;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 8vw 12px 8vw;
            background: transparent;
            position: relative;
            z-index: 10;
        }
        .nav-logo {
            font-size: 2.2rem;
            font-weight: bold;
            color: #e87ca4;
            letter-spacing: 2px;
        }
        .nav-links {
            display: flex;
            gap: 32px;
        }
        .nav-links a, .nav-links button {
            background: none;
            border: none;
            font-size: 1.1rem;
            color: #b88ca7;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            padding: 4px 12px;
            border-radius: 6px;
            transition: background 0.15s, color 0.15s;
        }
        .nav-links a:hover, .nav-links button:hover {
            background: #ffe2ec;
            color: #e87ca4;
        }
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
            padding: 0 8vw;
            text-align: center;
        }
        .hero-title {
            font-size: 2.8rem;
            color: #e87ca4;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 1.5px;
        }
        .hero-desc {
            font-size: 1.25rem;
            color: #b88ca7;
            margin-bottom: 28px;
        }
        .hero-img {
            width: 340px;
            max-width: 90vw;
            margin: 30px 0 18px 0;
            border-radius: 22px;
            box-shadow: 0 6px 32px #e9b3c540;
            border: 3px solid #ffe2ec;
            background: #fff0f5;
        }
        .try-btn {
            background: linear-gradient(90deg, #e87ca4 0%, #fbb1c8 100%);
            color: #fff;
            border: none;
            padding: 16px 42px;
            border-radius: 12px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 12px #e9b3c570;
            transition: background 0.2s, transform 0.1s;
            margin-top: 16px;
        }
        .try-btn:hover {
            background: #e87ca4;
            transform: translateY(-2px) scale(1.03);
        }
        @media (max-width: 700px) {
            .hero-title { font-size: 2rem; }
            .hero-img { width: 98vw; }
            .navbar { padding: 18px 4vw 8px 4vw; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-logo">Snooze</div>
        <div class="nav-links">
            <a href="#about">About Us</a>
            <button onclick="location.href='/login'">Login</button>
        </div>
    </nav>
    <main>
        <section class="hero">
            <div class="hero-title">Welcome to Snooze</div>
            <div class="hero-desc">A cozy, pastel, AI-powered reverse image search for your wardrobe and inspiration. Soft, comfy, and made for you.</div>
            
            <button class="try-btn" onclick="location.href='/signup'">Try Now</button>
        </section>
        <!-- How It Works Section (Screenshot Only) -->
        <section class="how-it-works-img" style="text-align:center; margin: 48px 0 0 0; padding: 0 8vw 18px 8vw;">
            <img src="/static/elements/how-it-works-screenshot.png" alt="How It Works Steps" style="max-width: 100%; height: auto; border-radius: 28px; box-shadow: 0 4px 32px #e9b3c540;">
        </section>

        <!-- Featured Products Section -->
        <section class="featured-products">
            <h3 class="featured-title">Featured Products</h3>
            <div class="carousel-wrapper">
                <button class="carousel-btn left" aria-label="Scroll left">&#8249;</button>
                <div class="carousel" id="carousel">
                    <img src="/static/elements/dress.png" alt="Dress" class="carousel-img">
                    <img src="/static/elements/dress2.jpg" alt="Dress 2" class="carousel-img">
                    <img src="/static/elements/dress3.jpg" alt="Dress 3" class="carousel-img">
                    <img src="/static/elements/dress4.jpg" alt="Dress 4" class="carousel-img">
                    <img src="/static/elements/long skirt.jpg" alt="Long Skirt" class="carousel-img">
                    <img src="/static/elements/pant.jpg" alt="Pant" class="carousel-img">
                    <img src="/static/elements/shirt.jpg" alt="Shirt" class="carousel-img">
                    <img src="/static/elements/shorts.jpg" alt="Shorts" class="carousel-img">
                    <img src="/static/elements/skirt.jpg" alt="Skirt" class="carousel-img">
                    <img src="/static/elements/skirt2.jpg" alt="Skirt 2" class="carousel-img">
                    <img src="/static/elements/sweater.jpg" alt="Sweater" class="carousel-img">
                    <img src="/static/elements/t shirt.jpg" alt="T Shirt" class="carousel-img">
                    <img src="/static/elements/top.jpg" alt="Top" class="carousel-img">
                </div>
                <button class="carousel-btn right" aria-label="Scroll right">&#8250;</button>
            </div>
        </section>
        <!-- Loved by Ethical Shoppers Section -->
        <section class="loved-by-shoppers-img" style="text-align:center; margin: 36px 0 0 0; padding: 0 8vw 18px 8vw;">
            <img src="/static/elements/loved-by-ethical-shoppers.png" alt="Loved by Ethical Shoppers" style="max-width: 100%; height: auto; border-radius: 28px; box-shadow: 0 4px 32px #e9b3c540; display: block; margin: 0 auto;">
        </section>
    </main>
    <style>
        .featured-products {
            margin: 48px 0 0 0;
            padding: 0 4vw 60px 4vw;
            text-align: center;
            background: linear-gradient(180deg, #fbefff 60%, #ffe2ec 100%);
        }
        .featured-title {
            font-size: 2.2rem;
            color: #e87ca4;
            margin-bottom: 28px;
            font-weight: bold;
            letter-spacing: 1.5px;
        }
        .carousel-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            position: relative;
            max-width: 100vw;
            margin: 0 auto;
        }
        .carousel {
            display: flex;
            overflow-x: auto;
            scroll-behavior: smooth;
            gap: 40px;
            padding: 38px 0;
            background: #fff0f5;
            border-radius: 28px;
            box-shadow: 0 4px 32px #e9b3c540;
            max-width: 1200px;
            min-width: 0;
        }
        .carousel-img {
            height: 260px;
            width: 190px;
            object-fit: cover;
            border-radius: 18px;
            border: 3px solid #ffd6e0;
            background: #fff6fa;
            box-shadow: 0 2px 12px #fbb1c855;
            flex: 0 0 auto;
            transition: transform 0.18s;
        }
        .carousel-img:hover {
            transform: scale(1.06) rotate(-2deg);
            box-shadow: 0 6px 32px #e9b3c570;
        }
        .carousel-btn {
            background: linear-gradient(90deg, #e87ca4 0%, #fbb1c8 100%);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            font-size: 1.6rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 8px #e9b3c5a0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.1s;
            z-index: 2;
        }
        .carousel-btn:hover {
            background: #e87ca4;
            transform: scale(1.08);
        }
        .carousel::-webkit-scrollbar {
            display: none;
        }
        @media (max-width: 700px) {
            .carousel-img { height: 80px; width: 60px; }
            .carousel { max-width: 96vw; }
        }
    </style>
    <script>
        // Carousel scroll logic
        const carousel = document.getElementById('carousel');
        document.querySelector('.carousel-btn.left').onclick = () => {
            carousel.scrollBy({ left: -220, behavior: 'smooth' });
        };
        document.querySelector('.carousel-btn.right').onclick = () => {
            carousel.scrollBy({ left: 220, behavior: 'smooth' });
        };
    </script>
</body>
</html>
